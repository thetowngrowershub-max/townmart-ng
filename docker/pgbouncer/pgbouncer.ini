; TownMart connection pooler. The app connects here (DATABASE_URL);
; migrations and backups go straight to Postgres.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling. TownMart sets its RLS context with set_config(…, true)
; and takes only transaction-level advisory locks, so nothing outlives a
; transaction.
pool_mode = transaction
max_prepared_statements = 200
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
max_client_conn = 1000
server_idle_timeout = 300
query_wait_timeout = 30
ignore_startup_parameters = extra_float_digits,search_path

; Encrypted to Postgres; clients may use TLS too (needed when the app runs
; elsewhere, e.g. Vercel, and reaches this pooler over the internet).
server_tls_sslmode = require
client_tls_sslmode = allow
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
client_tls_key_file = /etc/pgbouncer/tls/server.key

log_connections = 0
log_disconnections = 0
