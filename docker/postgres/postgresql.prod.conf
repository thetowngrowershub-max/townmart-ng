# TownMart production Postgres settings. Tune memory to the server:
# shared_buffers ≈ 25% of RAM, effective_cache_size ≈ 70%.

listen_addresses = '*'            # reachable only on the private Docker network; no port is published
port = 5432
max_connections = 120             # PgBouncer holds the app's pool; leave room for migrations and backups
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

# TLS: every TCP connection must use it (pg_hba.conf rejects plain TCP).
ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/server.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'

shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Monitoring: slowest statements on /admin/system; slow-query log.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
log_min_duration_statement = 500
log_lock_waits = on
log_temp_files = 0
log_timezone = 'UTC'
timezone = 'UTC'

# Point-in-time recovery: every WAL segment goes to pgBackRest within a minute
# (RPO well under the 15-minute target).
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=townmart archive-push %p'
archive_timeout = 60
max_wal_senders = 3
