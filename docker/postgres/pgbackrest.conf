# pgBackRest for TownMart. Secrets and the second repository come from
# PGBACKREST_* environment variables (backup.env), e.g.
#   PGBACKREST_REPO1_CIPHER_PASS, PGBACKREST_REPO2_TYPE=s3, PGBACKREST_REPO2_S3_BUCKET…
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# Weekly full backups: keep 3, so point-in-time recovery reaches back 2 to 3 weeks.
repo1-retention-full=3
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=detail

[townmart]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
